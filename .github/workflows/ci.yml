name: CI
on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint (errors)
        run: |
          shopt -s globstar nullglob
          shellcheck -S error \
            install.sh uninstall.sh \
            src/emerger.sh src/lib/**/*.sh share/plugins/*.sh share/profiles/*.sh completions/up.bash
      - name: Lint (warnings)
        run: |
          shopt -s globstar nullglob
          shellcheck -S warning \
            install.sh uninstall.sh \
            src/emerger.sh src/lib/**/*.sh share/plugins/*.sh share/profiles/*.sh completions/up.bash

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats zsh fish shellcheck
      - name: Require pwsh (tests/ps_*.bats skip without it)
        run: command -v pwsh && pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
      - name: Run bats (pwsh is preinstalled on the runner, so tests/ps_*.bats run)
        run: bats tests/
